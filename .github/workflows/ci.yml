name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Verification Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Codex adapter
        run: python adapters/codex/check.py

      - name: Check Cursor adapter
        run: python adapters/cursor/check.py

      - name: Check Antigravity adapter
        run: python adapters/antigravity/check.py

      - name: Check Claude adapter
        run: python adapters/claude/check.py

      - name: Run shared conformance checks
        run: python conformance/check.py

      - name: Test the installer
        run: python cricket test

      - name: Check orchestration policy
        run: python orchestration/check.py
